<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>统计字符、数字和汉字 & 生成二维码</title>
 <style>
 .result {
 margin-top: 10px;
 }
 </style>
 <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
</head>
<body>
 <h1>统计input里的字符、数字和汉字 & 生成二维码</h1>
 <div>
 <label  for="inputText">输入内容:</label>
 <input type="text" id="inputText" oninput="countCharacters()">
 </div>
 <div class="result" id="result"></div>
 <div>
 <button onclick="generateQRCode()">生成二维码</button>
 </div>
 <div id="qrcode"></div>
 <canvas id="qrcodeCanvas" style="display:none;"></canvas>
 <script>
 function countCharacters() {
 const inputText = document.getElementById('inputText').value;
 let charCount = 0; // 字符总数
 let numCount = 0; // 数字总数
 let chineseCount = 0; // 汉字总数
 // 遍历输入内容的每个字符
 for (let i = 0; i < inputText.length; i++) {
 const char = inputText.charAt(i);
 charCount++; // 增加字符总数
 // 检查是否是数字
 if (/\d/.test(char)) {
 numCount++;
 }
 // 检查是否是汉字（使用 Unicode范围判断）
 else if (/[\u4e00-\u9fa5]/.test(char)) {
 chineseCount++;
 }
 }
 // 显示统计结果
 const resultDiv = document.getElementById('result');
 resultDiv.innerHTML = `字符总数: ${charCount}, 数字总数: ${numCount}, 汉字总数: ${chineseCount}`;
 }

 function generateQRCode() {
 const qrText = document.getElementById('inputText').value;
 const qrcodeElement = document.getElementById('qrcode');
 qrcodeElement.innerHTML = ''; // 清空上次生成的二维码
 // 生成二维码
 QRCode.toCanvas(document.getElementById('qrcodeCanvas'), qrText, { width: 200 }, function (error) {
 if (error) console.error(error);
 console.log('成功生成二维码！');
 // 获取Canvas并转化为图片
 const canvas = document.getElementById('qrcodeCanvas');
 const pngUrl = canvas.toDataURL('image/png');
 // 显示二维码图片
 const img = new  Image();
 img.src = pngUrl;
 qrcodeElement.appendChild(img);
 // 创建下载链接
 const downloadLink = document.createElement('a');
 downloadLink.href = pngUrl;
 downloadLink.download = 'qrcode.png';
 downloadLink.innerText = '下载二维码';
 qrcodeElement.appendChild(downloadLink);
 });
 }
 </script>
</body>
</html>
